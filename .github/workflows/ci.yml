name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
      - name: Run tests
        run: |
          python -m pytest tests/ -v
      - name: Record Core100/Core300/Core1000 content and scoring audit
        run: python scripts/audit_core100_learning.py --all-packs --probe-attempts > "$RUNNER_TEMP/core100-learning-audit.json"
      - uses: actions/upload-artifact@v4
        with:
          name: core100-learning-audit
          path: ${{ runner.temp }}/core100-learning-audit.json
          retention-days: 7

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm exec tsc --noEmit
      - name: Build
        run: pnpm run build

  core100-real:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: "0.11.13"
      - uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: |
          uv sync --project ../backend --frozen
          pnpm install --frozen-lockfile
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
          fi
          pnpm exec playwright install --with-deps chromium
      - name: Real practice, review, specialty and listening workflows with frozen media
        run: pnpm test:e2e:core100-real
      - name: Opt-in Sound Compare candidate with real API and native audio
        run: pnpm test:e2e:sound-compare-candidate
      - name: Real Entry/Mid transitions and account isolation
        run: pnpm test:e2e:level-account-real
      - name: Retain failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: core100-real-failure
          path: |
            frontend/test-results/core100-real
            frontend/playwright-report/core100-real
            frontend/test-results/sound-compare-candidate
            frontend/playwright-report/sound-compare-candidate
            frontend/test-results/level-account-real
            frontend/playwright-report/level-account-real
          retention-days: 7
